name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.4.3) — must already exist on a commit'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore from secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set. APKs would be signed with a one-shot ephemeral keystore and users couldn't update in place."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ci-debug.keystore
          ks_size=$(stat -c%s ci-debug.keystore)
          echo "ci-debug.keystore size: $ks_size bytes"
          if [ "$ks_size" -lt 1024 ]; then
            echo "::error::Decoded keystore is suspiciously small ($ks_size bytes). Secret is probably corrupt."
            exit 1
          fi
          # Verify the keystore actually loads with the expected alias — fail
          # loudly here rather than silently shipping APKs signed with a Gradle
          # auto-generated keystore (different per run → won't install over).
          keytool -list -keystore ci-debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APKs for release
        run: |
          mkdir -p release
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release/zonik-v${VERSION}-debug.apk"
          cp wear/build/outputs/apk/debug/wear-debug.apk "release/zonik-wear-v${VERSION}-debug.apk"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          name: ${{ steps.ref.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/zonik-v${{ steps.version.outputs.version }}-debug.apk
            release/zonik-wear-v${{ steps.version.outputs.version }}-debug.apk
